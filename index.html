<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>我的英语网站</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: rgba(255, 255, 255, 0.95);
            padding: 50px 40px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 320px;
        }
        h2 { color: #555; font-size: 18px; margin-bottom: 30px; }
        .word { font-size: 42px; font-weight: 800; color: #2c3e50; margin-bottom: 15px; }
        .meaning { font-size: 20px; color: #7f8c8d; margin-bottom: 40px; }
        .btn-group { display: flex; flex-direction: column; gap: 15px; }
        button {
            color: white; border: none; padding: 15px 30px; border-radius: 50px;
            font-size: 16px; font-weight: bold; cursor: pointer; transition: all 0.3s ease;
        }
        button:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
        #btn-next { background: linear-gradient(to right, #2575fc, #6a11cb); }
        #btn-checkin { background: linear-gradient(to right, #ff7e5f, #feb47b); }
    </style>
</head>
<body>
<div class="card">
    <h2>考研核心词汇</h2>
    <div class="word" id="word-display">加载中</div>
    <div class="meaning" id="meaning-display"></div>

    <div class="btn-group">
        <button id="btn-next" onclick="fetchWord()">换一个单词</button>
        <button id="btn-checkin" onclick="checkIn()">今天背完了，打卡！</button>
        <button onclick="handleAnswer('认识')" style="background: #38a169;">认识</button>
        <button onclick="handleAnswer('不认识')" style="background: #e53e3e;">不认识</button>
        <button onclick="showWrongWords()" style="background: #3182ce; margin-top: 10px;">查看错词本</button>
    </div>
    <div id="stats-box"
         style="margin-top: 20px; font-size: 14px; color: #666; background: #f7fafc; padding: 10px; border-radius: 8px;">
        正在获取学习数据...
    </div>
</div>

<script>
    // 处理认识 / 不认识的逻辑
    async function handleAnswer(status) {
         const currentWord = document.getElementById('word-display').innerText;
         if (currentWord === "加载中" || currentWord === "获取中...") return;

    // 1. 把学习记录传给后端
         await fetch('/api/add_history', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ word: currentWord, status: status })
         });

    // 2. 如果不认识，就自动记入错词本
        if (status === '不认识') {
        await fetch('/api/add_wrong_word', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ word: currentWord })
        });
        // 红色闪烁提示
        document.body.style.backgroundColor = "#fed7d7";
        setTimeout(() => document.body.style.backgroundColor = "", 200);
        } else {
        // 绿色闪烁提示
        document.body.style.backgroundColor = "#c6f6d5";
        setTimeout(() => document.body.style.backgroundColor = "", 200);
        }

    // 3. 刷新统计面板的数字，并自动切下一个词
        loadStats();
        fetchWord();
    }

// 查看错词本弹窗
    async function showWrongWords() {
        const response = await fetch('/api/get_wrong_words');
        const data = await response.json();
        if (data.wrong_words.length === 0) {
        alert("你的错词本是空的，先去背几个词吧！");
        } else {
        alert("你的错词本：\\n\\n" + data.wrong_words.join("\\n"));
    }
}
    async function loadStats() {
        try {
    const response = await fetch('/api/get_stats');
    const data = await response.json();
    document.getElementById('stats-box').innerText =
        `你的战绩：已打卡 ${data.checkin_count} 次，共记录 ${data.wrong_count} 个错词！`;
} catch (error) {
    document.getElementById('stats-box').innerText = "无法获取数据";
}
}

// 页面打开时自动加载统计数据
loadStats();
    async function fetchWord() {
        const wordElement = document.getElementById('word-display');
        const meaningElement = document.getElementById('meaning-display');

        wordElement.innerText = "获取中...";
        meaningElement.innerText = "";

        try {
            const response = await fetch('/api/get_word');
            const data = await response.json();
            wordElement.innerText = data.word;
            meaningElement.innerText = data.meaning;
        } catch (error) {
            wordElement.innerText = "网络错误";
        }
    }

    async function checkIn() {
        try {
            const response = await fetch('/api/checkin', { method: 'POST' });
            const data = await response.json();
            alert(data.message);
        } catch (error) {
            alert("打卡失败，请检查后端是否运行");
        }
    }

    fetchWord();
</script>
</body>
</html>
