<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>我的英语网站</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: rgba(255, 255, 255, 0.95);
            padding: 50px 40px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 320px;
        }
        h2 { color: #555; font-size: 18px; margin-bottom: 30px; }
        .word { font-size: 42px; font-weight: 800; color: #2c3e50; margin-bottom: 15px; }
        .meaning { font-size: 20px; color: #7f8c8d; margin-bottom: 40px; }
        .btn-group { display: flex; flex-direction: column; gap: 15px; }
        button {
            color: white; border: none; padding: 15px 30px; border-radius: 50px;
            font-size: 16px; font-weight: bold; cursor: pointer; transition: all 0.3s ease;
        }
        button:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
        #btn-next { background: linear-gradient(to right, #2575fc, #6a11cb); }
        #btn-checkin { background: linear-gradient(to right, #ff7e5f, #feb47b); }
    </style>
</head>
<body>
    <div class="card">
        <h2>考研核心词汇</h2>
        <div class="word" id="word-display">加载中</div>
        <div class="meaning" id="meaning-display"></div>

        <div class="btn-group">
            <button id="btn-next" onclick="fetchWord()">换一个单词</button>
            <button id="btn-checkin" onclick="checkIn()">今天背完了，打卡！</button>
        </div>
    </div>

    <script>
        async function fetchWord() {
            const wordElement = document.getElementById('word-display');
            const meaningElement = document.getElementById('meaning-display');

            wordElement.innerText = "获取中...";
            meaningElement.innerText = "";

            try {
                const response = await fetch('/api/get_word');
                const data = await response.json();
                wordElement.innerText = data.word;
                meaningElement.innerText = data.meaning;
            } catch (error) {
                wordElement.innerText = "网络错误";
            }
        }

        async function checkIn() {
            try {
                const response = await fetch('/api/checkin', { method: 'POST' });
                const data = await response.json();
                alert(data.message);
            } catch (error) {
                alert("打卡失败，请检查后端是否运行");
            }
        }

        fetchWord();
    </script>
</body>
</html>
